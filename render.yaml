services:
  - type: web
    name: sahayak-senior-companion
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
